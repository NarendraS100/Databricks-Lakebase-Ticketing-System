<!DOCTYPE html>

<html>

<head>

<title>Lakebase Ticketing System</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:40px;

}

h1{

color:#333;

}

table{

width:100%;

border-collapse:collapse;

background:white;

box-shadow:0 2px 8px rgba(0,0,0,.15);

}

th{

background:#1976d2;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #ddd;

}

tr:hover{

background:#f8f8f8;

}

a{

text-decoration:none;

font-weight:bold;

color:#1976d2;

}

.open{

color:#d97706;

font-weight:bold;

}

.closed{

color:green;

font-weight:bold;

}

.in_progress{

color:#2563eb;

font-weight:bold;

}

.create-btn{

background:#1976d2;

color:white;

padding:12px 20px;

text-decoration:none;

border-radius:5px;

display:inline-block;

margin-bottom:20px;

font-weight:bold;

}

.create-btn:hover{

background:#1259a7;

color:white;

}

select{

padding:10px;

margin-right:10px;

}

button{

background:#1976d2;

color:white;

padding:10px 18px;

border:none;

border-radius:5px;

cursor:pointer;

}

button:hover{

background:#1259a7;

}

</style>

</head>

<body>

<h1>Lakebase Ticketing System</h1>

<form method="GET">

<select name="status">

<option value=""
{% if selected_status=="" %}
selected
{% endif %}
>
All Tickets
</option>

<option value="open"
{% if selected_status=="open" %}
selected
{% endif %}
>
Open
</option>

<option value="in_progress"
{% if selected_status=="in_progress" %}
selected
{% endif %}
>
In Progress
</option>

<option value="closed"
{% if selected_status=="closed" %}
selected
{% endif %}
>
Closed
</option>

</select>

<button type="submit">

Filter

</button>

</form>

<br>

<a href="/create-ticket" class="create-btn">
    + Create New Ticket
</a>

<table>

<tr>

<th>Ticket ID</th>

<th>Title</th>

<th>Status</th>

<th>Created By</th>

<th>Created At</th>

</tr>

{% for ticket in tickets %}

<tr>

<td>

<a href="/ticket/{{ ticket.ticket_id }}">

{{ ticket.ticket_id }}

</a>

</td>

<td>{{ ticket.title }}</td>

<td class="{{ ticket.status }}">{{ ticket.status }}</td>

<td>{{ ticket.created_by }}</td>

<td>{{ ticket.created_at }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
