<!DOCTYPE html>

<html>

<head>

<title>Create Ticket</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:40px;

}

.card{

background:white;

padding:30px;

border-radius:8px;

box-shadow:0 2px 8px rgba(0,0,0,.15);

width:500px;

}

input{

width:100%;

padding:10px;

margin-top:5px;

margin-bottom:20px;

}

button{

background:#1976d2;

color:white;

padding:12px 20px;

border:none;

border-radius:5px;

cursor:pointer;

}

button:hover{

background:#1557b0;

}

a{

text-decoration:none;

}

</style>

</head>

<body>

<a href="/">← Back</a>

<div class="card">

<h2>Create New Ticket</h2>

<form method="POST">

<label>Title</label>

<input
type="text"
name="title"
required>

<label>Created By</label>

<input
type="email"
name="created_by"
required>

<button type="submit">

Create Ticket

</button>

</form>

</div>

</body>

</html>
