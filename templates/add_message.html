<!DOCTYPE html>

<html>

<head>

<title>Add Message</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:40px;

}

.card{

width:600px;

background:white;

padding:30px;

border-radius:8px;

box-shadow:0 2px 8px rgba(0,0,0,.15);

}

textarea{

width:100%;

height:150px;

margin-bottom:20px;

padding:10px;

}

input{

width:100%;

padding:10px;

margin-bottom:20px;

}

button{

background:#1976d2;

color:white;

padding:12px 20px;

border:none;

border-radius:5px;

cursor:pointer;

}

button:hover{

background:#1259a7;

}

</style>

</head>

<body>

<a href="/ticket/{{ ticket_id }}">

← Back

</a>

<div class="card">

<h2>Add Message</h2>

<form method="POST">

<label>Author</label>

<input
type="email"
name="author"
required>

<label>Message</label>

<textarea
name="message"
required></textarea>

<button type="submit">

Add Message

</button>

</form>

</div>

</body>

</html>
