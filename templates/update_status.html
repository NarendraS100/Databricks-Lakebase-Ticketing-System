<!DOCTYPE html>

<html>

<head>

<title>Update Status</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:40px;

}

.card{

width:450px;

background:white;

padding:30px;

border-radius:8px;

box-shadow:0 2px 8px rgba(0,0,0,.15);

}

select{

width:100%;

padding:10px;

margin-top:15px;

margin-bottom:20px;

}

button{

background:#1976d2;

color:white;

padding:12px 20px;

border:none;

border-radius:5px;

cursor:pointer;

}

button:hover{

background:#1259a7;

}

</style>

</head>

<body>

<a href="/ticket/{{ ticket.ticket_id }}">← Back</a>

<div class="card">

<h2>Update Ticket Status</h2>

<p><b>Ticket :</b> {{ ticket.ticket_id }}</p>

<form method="POST">

<label>Status</label>

<select name="status">

<option value="open"
{% if ticket.status=="open" %}selected{% endif %}>
Open
</option>

<option value="in_progress"
{% if ticket.status=="in_progress" %}selected{% endif %}>
In Progress
</option>

<option value="closed"
{% if ticket.status=="closed" %}selected{% endif %}>
Closed
</option>

</select>

<button type="submit">

Update Status

</button>

</form>

</div>

</body>

</html>
